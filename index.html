 for(const x of(p.match(W)||[]))if(!STOP.has(x.toLowerCase())&&!new RegExp("^("+UN+")$","i").test(x))return x;return null}

function parse(raw){const s=w2n(raw.replace(/[,।.]/g," ")).replace(/\s+/g," ");const out=[];
 s.split(/\s+(?:और|aur|and|फिर|phir|तथा|आणि|અને|এবং|மற்றும்)\s+/i).forEach(p=>{const n=(p.match(/\d+/)||[])[0],num=n?+n:null;if(!num)return;

const hl=document.createElement("div"),dot=document.createElement("div");hl.id="hl";dot.id="dot";document.body.append(hl,dot);let cur=null;
